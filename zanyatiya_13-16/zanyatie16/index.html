<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1a">
  <title>Мини-викторина — занятие 16</title>
  <style>
    :root{color-scheme:dark;--bg:#080d1a;--panel:#0c1525;--line:#203750;--text:#f5faff;--muted:#a9bad0;--cyan:#36ccff;--violet:#b8a4ff}
    *{box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(ellipse at 12% 0%,#1d2244 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.6 Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,700px);padding:clamp(24px,6vw,48px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#101a2d,#0c1525);box-shadow:0 28px 80px #0005}
    .eyebrow{margin:0 0 10px;color:var(--violet);font-size:.76rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,7vw,3.25rem);letter-spacing:-.05em;line-height:1.08}
    .intro{margin:14px 0 30px;color:var(--muted)}
    #progress{color:var(--cyan);font-size:.9rem;font-weight:700}
    #question{margin:10px 0 20px;font-size:1.35rem}
    #options{display:grid;gap:10px}
    #options label{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#0b1422;cursor:pointer}
    #options label:has(input:checked){border-color:var(--cyan);background:#10243b}
    input{accent-color:var(--cyan)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    button{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:10px;background:#14253a;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
    button:first-child{border-color:var(--cyan);background:var(--cyan);color:#07111d}
    button:disabled{opacity:.45;cursor:not-allowed}
    #feedback{min-height:28px;margin:20px 0 0;color:var(--cyan);font-weight:650}
    #result{margin:8px 0 0;color:var(--violet);font-size:1.1rem;font-weight:750}
    footer{margin-top:25px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
    code{color:var(--cyan)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Практика · JavaScript · 16</p>
    <h1>Мини-викторина</h1>
    <p class="intro">Добавьте вопросы в массив и реализуйте выбор ответа, обратную связь и подсчёт очков в <code>script.js</code>.</p>
    <p id="progress" aria-live="polite"></p>
    <h2 id="question">Здесь появится вопрос</h2>
    <div id="options"></div>
    <div class="actions">
      <button id="answerBtn" type="button">Ответить</button>
      <button id="nextBtn" type="button" disabled>Далее</button>
    </div>
    <p id="feedback" aria-live="polite"></p>
    <p id="result" aria-live="polite"></p>
    <footer>Проверьте граничные случаи: нет выбора, повторный ответ, последний вопрос и нулевой счёт.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
