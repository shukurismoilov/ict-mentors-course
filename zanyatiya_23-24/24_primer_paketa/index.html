<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор стоимости курса</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-bottom: 12px; }
    input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    #out { font-size: 18px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Калькулятор стоимости курса</h1>
  <label>Цена занятия, руб.<input type="number" id="price" value="1200"></label>
  <label>Количество занятий<input type="number" id="count" value="3"></label>
  <button id="calc">Посчитать</button>
  <p id="out">Результат появится здесь.</p>

  <script>
    const priceInput = document.getElementById("price");
    const countInput = document.getElementById("count");
    const out = document.getElementById("out");

    document.getElementById("calc").addEventListener("click", () => {
      const price = Number(priceInput.value);
      const count = Number(countInput.value);
      const total = price * count;
      const withDiscount = total - (total * 10) / 100;
      out.textContent = `Итого: ${total} руб., со скидкой 10%: ${withDiscount} руб.`;
    });
  </script>
</body>
</html>
