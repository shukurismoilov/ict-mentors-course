<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор стоимости курса</title>
</head>
<body>
  <h1>Калькулятор стоимости курса</h1>
  <label>Цена курса, руб. <input type="number" id="price" value="1200"></label>
  <br>
  <label>Количество занятий <input type="number" id="count" value="3"></label>
  <br>
  <button id="calc">Посчитать</button>
  <p id="out">Результат появится здесь.</p>
  <script>
    document.getElementById("calc").addEventListener("click", () => {
      const price = Number(document.getElementById("price").value);
      const count = Number(document.getElementById("count").value);
      const total = price * count;
      const discount = total * 10 / 100;
      const withDiscount = total - discount;
      console.log("Итого без скидки:", total);
      document.getElementById("out").textContent =
        "Итого: " + total + " руб., со скидкой 10%: " + withDiscount + " руб.";
    });
  </script>
</body>
</html>
